<div class="p-6 sm:p-20 bg-slate-50 min-h-full">
  @if (_zakahService.latestResult(); as result) {
  <div class="max-w-4xl mx-auto">
    <header class="mb-8 text-center">
      <h1 class="text-3xl font-bold text-slate-800">اكتمل الحساب!</h1>
      <p class="text-slate-500 mt-2 text-lg">لقد أنشأت بنجاح خط الأساس لزكاتك. إليك ما يجب فعله بعد ذلك.</p>
    </header>

    <!-- Zakah Result Summary -->
    <div class="mb-8">
      <div class="bg-white rounded-xl shadow p-6 text-center animate-fade-in">
        <h2 class="text-lg font-semibold text-slate-600">زكاتك المستحقة هي</h2>
        <p class="text-5xl font-extrabold text-emerald-600 tracking-tight mt-2">
          {{ result.zakahAmount | currency:'EGP' }}
        </p>
        <p class="text-slate-500 mt-1">{{ zakahStatusMessageMap[result.status] }}</p>
      </div>
    </div>

    <div class="bg-white rounded-xl shadow p-6 sm:p-8 space-y-6">
      <h2 class="text-2xl font-semibold text-slate-800 text-center">اختر خطوتك التالية</h2>

      <div class="flex flex-col md:flex-row gap-6">
        <!-- Card 1: Go to Dashboard -->
        <button (click)="onViewDashboard()"
          class="flex-1 p-6 bg-emerald-50 rounded-lg border-2 border-emerald-400 focus:outline-none focus:ring-2 focus:ring-emerald-400 transition-all duration-300 text-start">
          <div class="flex items-center gap-4 mb-3">
            <div class="shrink-0 w-12 h-12 bg-emerald-100 text-emerald-600 rounded-lg flex items-center justify-center">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24"
                stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round"
                  d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z" />
              </svg>
            </div>
            <h3 class="text-xl font-bold text-slate-700">عرض لوحة التحكم</h3>
          </div>
          <p class="text-slate-600">
            شاهد تفصيلاً دقيقاً لحسابك، راجع حالة زكاتك، واطلع على سجلك الكامل.
          </p>
        </button>

        <!-- Card 2: Start New Calculation -->
        <button (click)="onStartNewCalculation()"
          class="flex-1 p-6 bg-slate-50 rounded-lg border-2 border-slate-200 hover:border-blue-500 hover:bg-blue-50 focus:outline-none focus:ring-2 focus:ring-blue-400 transition-all duration-300 text-start">
          <div class="flex items-center gap-4 mb-3">
            <div class="shrink-0 w-12 h-12 bg-blue-100 text-blue-600 rounded-lg flex items-center justify-center">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24"
                stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round"
                  d="M12 9v3m0 0v3m0-3h3m-3 0H9m12 0a9 9 0 11-18 0 9 9 0 0118 0z" />
              </svg>
            </div>
            <h3 class="text-xl font-bold text-slate-700">بدء حساب جديد</h3>
          </div>
          <p class="text-slate-600">
            إذا مر عام هجري كامل (الحول)، يمكنك بدء حسابك التالي بميزانية عمومية محدثة الآن.
          </p>
        </button>
      </div>
    </div>
  </div>
  }
</div>
